name: Deploy backend su Render

# Render a volte non si accorge da solo dei push (il collegamento GitHub↔Render
# può restare disconnesso); questo workflow chiama direttamente il Deploy Hook
# di Render così il deploy parte sempre.

on:
  push:
    branches: [main]
    paths: ["nodeBE/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

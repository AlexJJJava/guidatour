name: Deploy web su GitHub Pages

on:
  push:
    branches: [main]
    paths: ["flutter/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: >
          flutter build web --release
          --base-href /guidatour/
          --dart-define=BACKEND_URL=https://guidatour.onrender.com
        working-directory: flutter
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
